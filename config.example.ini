; Copy to config.ini (same directory) and edit.
; config.ini is gitignored. Do not put real topics or tokens in tracked files.

[ntfy]
; iOS ntfy app: subscribe to this topic on the same server.
server = https://ntfy.sh
topic = CHANGE-ME-to-a-long-random-topic
; Optional. Required if the server enforces auth (ntfy pro / self-hosted ACL).
token =

[monitor]
; Empty = every device smartctl --scan returns.
; Comma-separated names as smartctl prints them, e.g. /dev/sda, /dev/sdb
; Windows examples: /dev/sda  or  PD0
drives =
; true = run the check, log findings, send nothing to ntfy (including Sunday OK).
silence_alerts = false
; Used for the Sunday heartbeat. On Windows install: pip install tzdata
timezone = America/New_York
; Documentation for cron / Task Scheduler. This process does one check and exits.
check_interval_hours = 24
; 0=Monday ... 6=Sunday. Heartbeat only fires on this weekday when the check is clean.
weekly_ok_weekday = 6
; Empty = socket.gethostname()
hostname =

[smartctl]
; Empty = search PATH, then common install locations.
path =
timeout_seconds = 90
; true = do not spin a sleeping disk just to read SMART (logged as skip, not an alert).
skip_if_standby = true

[thresholds]
; Celsius. NVMe JSON temperature is Kelvin and is converted.
temp_warn_c = 50
temp_fail_c = 60
; Raw counts. 1 means "any non-zero is already worth a look".
realloc_warn = 1
pending_warn = 1
uncorrectable_warn = 1
reported_uncorrect_warn = 1
spin_retry_warn = 1
end_to_end_warn = 1
; Interface/cable noise; not media failure by itself.
crc_warn = 10
; NVMe
nvme_percent_used_warn = 90
nvme_percent_used_fail = 100
nvme_media_errors_warn = 1
; If the drive reports a spare threshold, that value wins when it is higher.
nvme_available_spare_min_pct = 10
